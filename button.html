<!-- button (component) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        .btn-info {
            background-color: red;
        }
        .btn-info:hover {
            background-color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>button created</h3>
        <button class="btn">click me</button>

      <h3>background-color of button</h3>
              <button class="btn btn-success">btn 2</button>
              <button class="btn btn-info">btn 3</button>
              <button class="btn btn-warning">btn 4</button>
              <button class="btn btn-light">btn 5</button>
              <button class="btn btn-dark">btn 6</button>

    
              <h3>outline button </h3>
               <button class="btn btn-outline-success ">hello</button>

               <h3>button size </h3>
                <button class="btn btn-outline-danger btn-lg ">hello</button>
                <button class="btn btn-light btn-sm">btn 5</button>

                <h3>Disabled state : to make button non-clickable </h3>
                <button class="btn btn-outline-dark" disabled>Click me</button>

                <h3>to display ancher tag , like a button but internally it is an ancher tag</h3>
                <a class="btn btn-outline-danger btn-lg" href="/google.com">Google me</a>

                <!-- read docs for button -->
                <h4> <a target="_blank" href="https://getbootstrap.com/docs/5.3/components/buttons/">read docs for button</a></h4>

                <!-- badges (component) : -->

                <br>
                <h2>create badges</h2>
                <span class="badge bg-primary">10+</span>
                <span class="badge bg-danger">new+</span>

                <h1>Notification <span class="badge bg-danger  ">20+</span> </h1>

                <button class="btn btn-primary"> Message <span class="badge bg-secondary ">10+</span></button>

                <!-- Pill badges : make  bages round -->
                <span class="badge bg-primary rounded-pill ">100+</span>


    </div>
</body>
</html>
